<!DOCTYPE html>
<html lang="{{htmlLang}}" data-lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4bdda">
  <link rel="icon" type="image/png" href="{{base}}mmqbmq.png">
  <link rel="apple-touch-icon" href="{{base}}mmqbmq.png">
  {{head}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{base}}styles.css">
</head>
<body data-page="home" data-base="{{base}}">
  <a class="skip-link" href="#main-content" data-i18n="skipContent"></a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Malmequer bem me quer">
        <img class="brand-logo" src="{{base}}mmqbmq.png" alt="" width="60" height="60">
        <strong class="brand-name" translate="no">Malmequer bem me quer</strong>
      </a>

      <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="nav-panel" aria-expanded="false" data-i18n-aria="menuLabel">
        <span></span>
        <span></span>
        <span></span>
        <span class="visually-hidden" data-i18n="menuLabel"></span>
      </button>

      <div class="nav-panel" id="nav-panel">
        <nav class="nav-links" aria-label="Principal" data-i18n-aria="navLabel">
          <a class="nav-link" href="catalogo.html" data-i18n="navCatalog"></a>
          <a class="nav-link" href="#encomendar" data-i18n="navOrder"></a>
          <a class="nav-link" href="#empresa" data-i18n="navCompany"></a>
        </nav>

        <div class="lang-switch" role="group" aria-label="Seletor de idioma" data-i18n-aria="languageLabel">
          {{langLinks}}
        </div>

        <a class="button small js-whatsapp-generic" href="https://wa.me/351935521564" target="_blank" rel="noopener" data-whatsapp-context="general" data-i18n="ctaWhatsApp"></a>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="hero">
      <div class="wrap hero-inner">
        <div class="hero-copy">
          <p class="hero-kicker" data-i18n="heroKicker"></p>
          <h1 data-i18n="homeHeroTitle"></h1>
          <p class="hero-lead" data-i18n="homeHeroDesc"></p>
          <div class="hero-actions">
            <a class="button js-whatsapp-generic" href="https://wa.me/351935521564" target="_blank" rel="noopener" data-whatsapp-context="general" data-i18n="ctaWhatsApp"></a>
            <!--ready-->
            <a class="button ghost" href="catalogo.html" data-i18n="ctaCatalog"></a>
            <!--/ready-->
          </div>
        </div>
        <img class="hero-logo" src="{{base}}mmqbmq.png" alt="Logótipo da Malmequer bem me quer" data-i18n-alt="logoAlt" width="605" height="603" fetchpriority="high">
      </div>
    </section>

    <dl class="facts">
      <div class="fact">
        <dt data-i18n="fact1Label"></dt>
        <dd data-i18n="fact1Value"></dd>
      </div>
      <div class="fact">
        <dt data-i18n="fact2Label"></dt>
        <dd data-i18n="fact2Value"></dd>
      </div>
      <div class="fact">
        <dt data-i18n="fact3Label"></dt>
        <dd data-i18n="fact3Value"></dd>
      </div>
      <div class="fact">
        <dt data-i18n="fact4Label"></dt>
        <dd>Português, español, English</dd>
      </div>
    </dl>

    <!--ready-->
    <noscript class="noscript-note" data-i18n="noScript"></noscript>
    <!--/ready-->

    <div class="waistband" aria-hidden="true" translate="no"></div>
    <div class="wall">
      <div class="wall-item"><picture><source type="image/webp" srcset="{{base}}img/modelo-branca-600.webp 600w, {{base}}img/modelo-branca.webp 1000w" sizes="(max-width: 700px) 100vw, 34vw"><img src="{{base}}img/modelo-branca.jpg" alt="Mulher a vestir modelo branco de cintura alta" data-i18n-alt="wallAlt2" width="1000" height="1000" loading="lazy" decoding="async"></picture></div>
      <div class="wall-item"><picture><source type="image/webp" srcset="{{base}}img/modelo-renda-600.webp 600w, {{base}}img/modelo-renda.webp 1000w" sizes="(max-width: 700px) 50vw, 34vw"><img src="{{base}}img/modelo-renda.jpg" alt="Mulher a vestir modelo branco com renda lateral" data-i18n-alt="wallAlt1" width="1000" height="1000" loading="lazy" decoding="async"></picture></div>
      <div class="wall-item"><picture><source type="image/webp" srcset="{{base}}img/modelo-nude-600.webp 600w, {{base}}img/modelo-nude.webp 1000w" sizes="(max-width: 700px) 50vw, 34vw"><img src="{{base}}img/modelo-nude.jpg" alt="Mulher a vestir modelo cor de pele de cintura alta" data-i18n-alt="wallAlt3" width="1000" height="1000" loading="lazy" decoding="async"></picture></div>
    </div>

    <section class="section wrap reasons-layout">
      <h2 class="section-title" data-i18n="benefitsTitle"></h2>
      <ol class="reasons">
        <li class="reason">
          <h3 data-i18n="benefit1Title"></h3>
          <p data-i18n="benefit1Desc"></p>
        </li>
        <li class="reason">
          <h3 data-i18n="benefit2Title"></h3>
          <p data-i18n="benefit2Desc"></p>
        </li>
        <li class="reason">
          <h3 data-i18n="benefit3Title"></h3>
          <p data-i18n="benefit3Desc"></p>
        </li>
      </ol>
    </section>

    <section class="section lines-section">
      <div class="wrap">
        <div class="section-head">
          <h2 class="section-title" data-i18n="collectionsTitle"></h2>
        </div>
        <div class="lines" id="home-collections"></div>
      </div>
    </section>

    <!--ready-->
    <section class="section wrap">
      <div class="section-head">
        <h2 class="section-title" data-i18n="previewTitle"></h2>
        <a class="text-link" href="catalogo.html" data-i18n="previewAll"></a>
      </div>
      <div class="product-grid" id="home-preview"></div>
    </section>
    <!--/ready-->
    <!--building-->
    <section class="section wrap building-note">
      <h2 class="section-title" data-i18n="buildingTitle"></h2>
      <p data-i18n="buildingDesc"></p>
      <a class="button js-whatsapp-generic" href="https://wa.me/351935521564" target="_blank" rel="noopener" data-whatsapp-context="catalog" data-i18n="buildingCta"></a>
    </section>
    <!--/building-->

    <section class="section wrap" id="encomendar">
      <div class="section-head">
        <h2 class="section-title" data-i18n="processTitle"></h2>
      </div>
      <ol class="steps">
        <li class="step">
          <span class="step-number" aria-hidden="true">1</span>
          <!--ready-->
          <h3 data-i18n="process1Title"></h3>
          <p data-i18n="process1Desc"></p>
          <!--/ready-->
          <!--building-->
          <h3 data-i18n="process1BuildingTitle"></h3>
          <p data-i18n="process1BuildingDesc"></p>
          <!--/building-->
        </li>
        <li class="step">
          <span class="step-number" aria-hidden="true">2</span>
          <h3 data-i18n="process2Title"></h3>
          <!--ready-->
          <p data-i18n="process2Desc"></p>
          <!--/ready-->
          <!--building-->
          <p data-i18n="process2BuildingDesc"></p>
          <!--/building-->
        </li>
        <li class="step">
          <span class="step-number" aria-hidden="true">3</span>
          <h3 data-i18n="process3Title"></h3>
          <p data-i18n="process3Desc"></p>
        </li>
      </ol>
    </section>

    <section class="about" id="empresa">
      <div class="about-copy">
        <h2 class="section-title" data-i18n="aboutTitle"></h2>
        <p data-i18n="aboutBody1"></p>
        <p data-i18n="aboutBody2"></p>
        <p data-i18n="aboutBody3"></p>
        <p class="about-note" data-i18n="aboutNote"></p>
      </div>
      <div class="about-visual">
        <picture><source type="image/webp" srcset="{{base}}img/modelo-estampada-600.webp 600w, {{base}}img/modelo-estampada.webp 1000w" sizes="(max-width: 960px) 100vw, 50vw"><img src="{{base}}img/modelo-estampada.jpg" alt="Mulher a vestir modelo preto com pequeno estampado floral" data-i18n-alt="aboutAlt" width="1000" height="1000" loading="lazy" decoding="async"></picture>
      </div>
    </section>

    <section class="section wrap faq-layout">
      <h2 class="section-title" data-i18n="faqTitle"></h2>
      <div class="faq-list">
        <details class="faq-item">
          <summary data-i18n="faq1Q"></summary>
          <p data-i18n="faq1A"></p>
        </details>
        <details class="faq-item">
          <summary data-i18n="faq2Q"></summary>
          <p data-i18n="faq2A"></p>
        </details>
        <details class="faq-item">
          <summary data-i18n="faq3Q"></summary>
          <p data-i18n="faq3A"></p>
        </details>
        <details class="faq-item">
          <summary data-i18n="faq5Q"></summary>
          <p data-i18n="faq5A"></p>
        </details>
        <details class="faq-item">
          <summary data-i18n="faq6Q"></summary>
          <p data-i18n="faq6A"></p>
        </details>
        <details class="faq-item">
          <summary data-i18n="faq7Q"></summary>
          <p data-i18n="faq7A"></p>
        </details>
        <details class="faq-item">
          <summary data-i18n="faq4Q"></summary>
          <p data-i18n="faq4A"></p>
        </details>
      </div>
    </section>

    <section class="contact" id="contacto">
      <div class="wrap contact-inner">
        <div>
          <h2 data-i18n="contactTitle"></h2>
          <p class="contact-desc" data-i18n="contactDesc"></p>
        </div>
        <div>
          <a class="contact-phone" href="tel:+351935521564">+351 935 521 564</a>
          <ul class="contact-details">
            <li data-i18n="contactShipping"></li>
          </ul>
          <div class="contact-actions">
            <a class="button js-whatsapp-generic" href="https://wa.me/351935521564" target="_blank" rel="noopener" data-whatsapp-context="general" data-i18n="contactPrimary"></a>
            <!--ready-->
            <a class="button ghost" href="catalogo.html" data-i18n="ctaCatalog"></a>
            <!--/ready-->
          </div>
        </div>
      </div>
    </section>
  </main>

  <a class="floating-whatsapp js-whatsapp-generic" href="https://wa.me/351935521564" target="_blank" rel="noopener" data-whatsapp-context="general" aria-label="Falar no WhatsApp" data-i18n-aria="contactPrimary">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <div class="waistband" aria-hidden="true" translate="no"></div>
  <footer class="footer">
    <div class="footer-inner">
      <strong translate="no">Malmequer bem me quer</strong>
      <div><span id="current-year">2026</span> · <span data-i18n="footerNote"></span></div>
    </div>
  </footer>

  <script src="{{base}}site.js" defer></script>
</body>
</html>
